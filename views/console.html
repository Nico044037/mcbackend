<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Console History</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 92vh;
        }

        #status-bar {
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .connecting { background-color: #9e6a03; color: #fff; }
        .online { background-color: #238636; color: #fff; }
        .offline { background-color: #da3633; color: #fff; }

        #console-output {
            flex-grow: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #input-container {
            display: flex;
            margin-top: 12px;
            gap: 10px;
        }

        #command-input {
            flex-grow: 1;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: inherit;
        }

        #send-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:hover { background: #2ea043; }
        #send-btn:disabled, #command-input:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="status-bar" class="connecting">Connecting to Session...</div>
    <div id="console-output"></div>

    <div id="input-container">
        <input type="text" id="command-input" placeholder="Type a console command..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const sessionId = pathSegments[pathSegments.length - 1];

        const statusEl = document.getElementById('status-bar');
        const outputEl = document.getElementById('console-output');
        const inputEl = document.getElementById('command-input');
        const sendBtn = document.getElementById('send-btn');

        let ws = null;

        function appendLog(text) {
            const line = document.createElement('div');
            line.textContent = text;
            outputEl.appendChild(line);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function setStatus(status) {
            if (status === 'ONLINE') {
                statusEl.className = 'online';
                statusEl.textContent = 'Status: Server is Online';
                inputEl.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusEl.className = 'offline';
                statusEl.textContent = 'Status: Server is Offline';
                inputEl.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function connectRelay() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/console/history/${sessionId}`;

            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'init') {
                    outputEl.innerHTML = '';
                    if (msg.logs && msg.logs.length > 0) {
                        msg.logs.forEach(log => appendLog(log));
                    }
                    setStatus(msg.status);
                } 
                else if (msg.type === 'log') {
                    appendLog(msg.data);
                } 
                else if (msg.type === 'status') {
                    setStatus(msg.status);
                }
            };

            ws.onclose = () => {
                setStatus('OFFLINE');
                appendLog('[SYSTEM] Lost connection to relay backend.');
            };
        }

        function sendCommand() {
            const cmd = inputEl.value.trim();
            if (cmd && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'command', command: cmd }));
                inputEl.value = '';
            }
        }

        sendBtn.addEventListener('click', sendCommand);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        connectRelay();
    </script>
</body>
</html>
